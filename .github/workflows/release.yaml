name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.1'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  RELEASE_TAG: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Test and vet
        run: |
          go test -race -timeout 2m ./...
          go vet ./...
      - name: Check version without Canvas credentials
        env:
          CGO_ENABLED: '0'
        run: |
          version=${RELEASE_TAG#v}
          binary="$RUNNER_TEMP/canvas-mcp.exe"
          go build -trimpath \
            -ldflags "-s -w -X github.com/daskol/canvas-mcp/internal/buildinfo.Version=$version" \
            -o "$binary" ./cmd/canvas-mcp
          actual=$("$binary" --version)
          [[ "$actual" == "canvas-mcp $version" ]]

  build:
    name: Build release archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Validate version
        run: |
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build and archive
        run: |
          version=${RELEASE_TAG#v}
          source_date_epoch=$(git log -1 --format=%ct)
          mkdir -p dist
          export GOOS GOARCH
          for GOOS in darwin linux windows; do
            for GOARCH in amd64 arm64; do
              package_dir="$RUNNER_TEMP/canvas-mcp-$GOOS-$GOARCH"
              mkdir -p "$package_dir"
              binary=canvas-mcp
              if [[ "$GOOS" == windows ]]; then binary+=.exe; fi
              go build -trimpath \
                -ldflags "-s -w -X github.com/daskol/canvas-mcp/internal/buildinfo.Version=$version" \
                -o "$package_dir/$binary" ./cmd/canvas-mcp
              cp README.md LICENSE "$package_dir/"

              # Fix timestamps and archive metadata for repeatable packaging.
              touch -d "@$source_date_epoch" "$package_dir/"*
              archive="$PWD/dist/canvas-mcp_${version}_${GOOS}_${GOARCH}"
              if [[ "$GOOS" == windows ]]; then
                archive+=.zip
                (cd "$package_dir" && TZ=UTC zip -X "$archive" "$binary" README.md LICENSE)
              else
                archive+=.tar.gz
                tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner \
                  -cf - -C "$package_dir" "$binary" README.md LICENSE | gzip -n > "$archive"
              fi
              [[ -s "$archive" ]]
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Store release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete release
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Collect release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: dist
      - name: Verify release archives
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Refuse to modify a published release
        run: |
          response="$RUNNER_TEMP/release.json"
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$response"; then
            if ! jq -e '.draft == true' "$response" > /dev/null; then
              echo 'This version is already published. Create a new version tag.' >&2
              exit 1
            fi
          else
            jq -e '.status == "404"' "$response" > /dev/null
          fi
      - name: Create or resume draft and upload all assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - name: Publish release
        # Enable release immutability in repository settings to lock assets and tags.
        run: gh release edit "$RELEASE_TAG" --draft=false
